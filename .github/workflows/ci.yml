name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: default
      - run: pixi run configure
      - run: pixi run build
      # The goldens are only evidence of upstream parity while they are still
      # what the capnp CLI emits; the suite cannot tell them apart from our
      # own earlier output.
      - name: goldens still match the capnp CLI
        run: pixi run -- bash scripts/gen-sample-fixtures.sh --check

      - name: level 3 frames still match the capnp CLI
        run: pixi run -- bash scripts/gen-rpc-frames.sh --check
      - run: pixi run test
      # test_codegen.sh exits 0 when the capnp CLI is missing. capnproto is a
      # default-environment dependency so that skip means a real failure.
      - name: codegen test ran rather than skipped
        run: pixi run -- capnp --version

  janet:
    name: janet module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: janet
      # The meson C tests never load the Janet module, so the CFUN
      # registration is only covered by installing the bundle the way
      # janet-lang/pkgs consumers do.
      - name: bundle install and API smoke
        run: pixi run -e janet -- bash scripts/janet-bundle-smoke.sh
      - name: meson build with the Janet module enabled
        run: |
          pixi run -e janet -- meson setup build-janet -Djanet=enabled
          pixi run -e janet -- meson compile -C build-janet
          test -f build-janet/capnp.so

  packaging:
    name: downstream consumption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: default
      # Install rules that nothing exercises are how a broken Config.cmake
      # or a stale .pc reaches users. This builds a consumer four ways.
      - name: CMake, find_package, pkg-config and meson subproject
        run: pixi run -- bash scripts/packaging-smoke.sh

  rpc-interop:
    name: live capnp-C++ RPC peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.3
        with:
          environments: default
      # Byte equality against our own encoders says nothing about whether
      # the reference implementation will talk to us. This bootstraps a
      # real EzRpcServer and calls it.
      - name: Configure and build
        run: |
          pixi run -- meson setup build-interop
          pixi run -- meson compile -C build-interop
      - name: The interop test ran rather than being skipped
        run: |
          pixi run -- meson test -C build-interop rpc_interop_cpp --print-errorlogs
          test -x build-interop/rpc_peer_server
