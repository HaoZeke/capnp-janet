name: big-endian

# The wire format is little-endian; the host need not be. A builder that
# copies host-order words into a message round-trips perfectly on a
# little-endian machine, because the reader undoes exactly what the
# writer did, and is wrong on the wire. That defect shipped in 0.2.1 and
# was caught by someone else's s390x runners, so run our own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  s390x:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: cache the s390x Cap'n Proto 1.4.0 install
        uses: actions/cache@v4
        with:
          path: .cache/capnp-1.4.0
          key: capnp-1.4.0-s390x-v1
      - name: full suite on emulated s390x (big-endian)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu24.04
          # bookworm's apt meson is 1.0.1 and meson.build requires >= 1.2,
          # so setup failed before any test ran. ubuntu24.04 ships 1.3.x.
          # No githubToken: GHCR package create is denied for this account
          # and the suite does not need it.
          # Distro capnproto is older than 1.4.0, so the C++ interop peers
          # would not build. Install the release tarball instead. The tree
          # lives in the workspace, which this action mounts, so the cache
          # step above can reuse it on the next run.
          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential meson ninja-build pkg-config curl ca-certificates python3
          run: |
            set -euo pipefail
            uname -m
            cc --version | head -1
            python3 -c 'import sys; print("byteorder:", sys.byteorder)'
            root="$(pwd)"
            PREFIX="$root/.cache/capnp-1.4.0"
            if [[ ! -x "$PREFIX/bin/capnp" ]] || ! "$PREFIX/bin/capnp" --version | grep -q '1.4.0'; then
              rm -rf "$PREFIX"
              mkdir -p "$PREFIX"
              curl -fsSL -o /tmp/capnproto-c++-1.4.0.tar.gz \
                https://capnproto.org/capnproto-c++-1.4.0.tar.gz
              tar -C /tmp -xzf /tmp/capnproto-c++-1.4.0.tar.gz
              cd /tmp/capnproto-c++-1.4.0
              ./configure --prefix="$PREFIX"
              make -j"$(nproc)"
              make install
              cd "$root"
            fi
            export PATH="$PREFIX/bin:$PATH"
            libdir="$PREFIX/lib"
            if [[ -d "$PREFIX/lib64/pkgconfig" ]]; then
              libdir="$PREFIX/lib64"
            fi
            export PKG_CONFIG_PATH="$libdir/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            capnp --version | grep -q '1.4.0'
            pkg-config --modversion capnp-rpc | grep -q '^1.4.0$'
            meson setup build
            meson test -C build --print-errorlogs
