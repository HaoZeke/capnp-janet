[workspace]
name = "capnp-janet"
description = "Native Cap'n Proto runtime for Janet"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
c-compiler = "*"
meson = ">=1.4"
ninja = "*"
pkg-config = "*"
# test/test_codegen.sh drives capnpc-janet through the capnp CLI, and skips
# itself when the CLI is absent. Keep it here so the skip never fires in CI.
capnproto = ">=1.0"

[feature.janet.dependencies]
janet = ">=1.36"
pkg-config = "*"

[feature.docs]
dependencies = { python = ">=3.10", sphinx = ">=7,<9", emacs = "*" }
[feature.docs.pypi-dependencies]
shibuya = ">=2025.12.13, <2027"
sphinx-copybutton = ">=0.5.2, <1"
sphinx-design = ">=0.6, <1"
myst-parser = ">=4.0, <5"
sphinxcontrib-mermaid = ">=1.0, <2"
[feature.docs.tasks]
orgbld = { cmd = "emacs --batch -l docs/export.el", description = "Export docs/orgmode/*.org to docs/source/*.rst" }
docs = { cmd = "sphinx-build docs/source docs/build -b html", depends-on = ["orgbld"], description = "Build the Sphinx HTML docs" }
docs-clean = { cmd = "rm -rf docs/build docs/source/*.rst", description = "Remove built docs and ox-rst output" }

[environments]
default = []
janet = ["janet"]
docs = ["docs"]

[tasks]
configure = { cmd = "meson setup build --prefix=$CONDA_PREFIX", description = "Meson setup" }
build = { cmd = "meson compile -C build", description = "Compile" }
test = { cmd = "meson test -C build -v", description = "Run tests" }
reconfigure = { cmd = "meson setup build --reconfigure --prefix=$CONDA_PREFIX" }
